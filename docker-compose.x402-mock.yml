services:
  x402-scenario:
    build: .
    command: ["bun", "dist/cli.js", "x402", "scenario"]

  sponsor-feed:
    build: .
    command: ["bun", "dist/cli.js", "claims", "list"]
    environment:
      ZAP_NODE_ID: sponsor-feed
      ZAP_CLAIM_FEED: claims/x402-mock.json

  witness-peg:
    build: .
    command: ["bun", "dist/cli.js", "run", "--daemon", "--ticks", "1"]
    environment:
      ZAP_NODE_ID: witness-peg
      ZAP_CLAIM_FEED: claims/x402-mock.json
      ZAP_WITNESS_DOMAIN: stablecoins
      ZAP_WITNESS_KINDS: yes_no
      DEEPSEEK_MOCK: "1"
      DEEPSEEK_KEY_FILE: /run/secrets/deepseek.md
    volumes:
      - ../deepseek.md:/run/secrets/deepseek.md:ro

  witness-attestation:
    build: .
    command: ["bun", "dist/cli.js", "run", "--daemon", "--ticks", "1"]
    environment:
      ZAP_NODE_ID: witness-attestation
      ZAP_CLAIM_FEED: claims/x402-mock.json
      ZAP_WITNESS_DOMAIN: stablecoins
      ZAP_WITNESS_KINDS: hash_attestation
      DEEPSEEK_MOCK: "1"
      DEEPSEEK_KEY_FILE: /run/secrets/deepseek.md
    volumes:
      - ../deepseek.md:/run/secrets/deepseek.md:ro

  witness-availability:
    build: .
    command: ["bun", "dist/cli.js", "run", "--daemon", "--ticks", "1"]
    environment:
      ZAP_NODE_ID: witness-availability
      ZAP_CLAIM_FEED: claims/x402-mock.json
      ZAP_WITNESS_DOMAIN: availability
      ZAP_WITNESS_KINDS: yes_no
      DEEPSEEK_MOCK: "1"
      DEEPSEEK_KEY_FILE: /run/secrets/deepseek.md
    volumes:
      - ../deepseek.md:/run/secrets/deepseek.md:ro
