name: oleander-x402

services:
  x402-facilitator:
    build: .
    command: ["bun", "dist/cli.js", "x402", "serve", "facilitator"]
    ports:
      - "8403:8403"
    environment:
      X402_FACILITATOR_PORT: 8403
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:8403/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 2s
      timeout: 2s
      retries: 10

  x402-resource:
    build: .
    command: ["bun", "dist/cli.js", "x402", "serve", "resource"]
    ports:
      - "8404:8404"
    environment:
      X402_RESOURCE_PORT: 8404
      ZAP_CLAIM_FEED: ${ZAP_SPONSORED_CLAIM_FEED:-claims/x402-mock.json}
      X402_PAYMENT_HEADER: mock-paid
    depends_on:
      x402-facilitator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:8404/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 2s
      timeout: 2s
      retries: 10

  x402-scenario:
    build: .
    command: ["bun", "dist/cli.js", "x402", "scenario"]

  sponsor-feed:
    build: .
    command: ["bun", "dist/cli.js", "claims", "list"]
    environment:
      ZAP_NODE_ID: sponsor-feed
      ZAP_CLAIM_FEED: http://x402-resource:8404/claims
      X402_PAYMENT_HEADER: mock-paid
    depends_on:
      x402-resource:
        condition: service_healthy

  witness-peg:
    build: .
    command: ["bun", "dist/cli.js", "x402", "work", "--once"]
    environment:
      ZAP_RUNTIME_MODE: local
      ZAP_SIGNER_MODE: dev
      X402_MODE: mock
      ZAP_NODE_ID: witness-peg
      ZAP_CLAIM_FEED: http://x402-resource:8404/claims
      ZAP_WITNESS_DOMAIN: stablecoins
      ZAP_WITNESS_KINDS: yes_no
      X402_PAYMENT_HEADER: mock-paid
      X402_SPONSOR_ID: ${X402_SPONSOR_ID:-sponsor:x402:mock}
      X402_BOUNTY_ATOMIC: ${X402_BOUNTY_ATOMIC:-1000000}
      ZAP_REWARD_ATOMIC: ${ZAP_REWARD_ATOMIC:-1000000000000000000}
      DEEPSEEK_MOCK: "1"
      ZAP_RUN_ARTIFACT_DIR: /app/runs
    volumes:
      - ./runs:/app/runs
    depends_on:
      x402-resource:
        condition: service_healthy

  witness-attestation:
    build: .
    command: ["bun", "dist/cli.js", "x402", "work", "--once"]
    environment:
      ZAP_RUNTIME_MODE: local
      ZAP_SIGNER_MODE: dev
      X402_MODE: mock
      ZAP_NODE_ID: witness-attestation
      ZAP_CLAIM_FEED: http://x402-resource:8404/claims
      ZAP_WITNESS_DOMAIN: stablecoins
      ZAP_WITNESS_KINDS: hash_attestation
      X402_PAYMENT_HEADER: mock-paid
      X402_SPONSOR_ID: ${X402_SPONSOR_ID:-sponsor:x402:mock}
      X402_BOUNTY_ATOMIC: ${X402_BOUNTY_ATOMIC:-1000000}
      ZAP_REWARD_ATOMIC: ${ZAP_REWARD_ATOMIC:-1000000000000000000}
      DEEPSEEK_MOCK: "1"
      ZAP_RUN_ARTIFACT_DIR: /app/runs
    volumes:
      - ./runs:/app/runs
    depends_on:
      x402-resource:
        condition: service_healthy

  witness-availability:
    build: .
    command: ["bun", "dist/cli.js", "x402", "work", "--once"]
    environment:
      ZAP_RUNTIME_MODE: local
      ZAP_SIGNER_MODE: dev
      X402_MODE: mock
      ZAP_NODE_ID: witness-availability
      ZAP_CLAIM_FEED: http://x402-resource:8404/claims
      ZAP_WITNESS_DOMAIN: availability
      ZAP_WITNESS_KINDS: yes_no
      X402_PAYMENT_HEADER: mock-paid
      X402_SPONSOR_ID: ${X402_SPONSOR_ID:-sponsor:x402:mock}
      X402_BOUNTY_ATOMIC: ${X402_BOUNTY_ATOMIC:-1000000}
      ZAP_REWARD_ATOMIC: ${ZAP_REWARD_ATOMIC:-1000000000000000000}
      DEEPSEEK_MOCK: "1"
      ZAP_RUN_ARTIFACT_DIR: /app/runs
    volumes:
      - ./runs:/app/runs
    depends_on:
      x402-resource:
        condition: service_healthy
