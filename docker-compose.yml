name: oleander

services:
  browser-harness:
    build: .
    command: ["bun", "dist/cli.js", "harness", "serve"]
    ports:
      - "${ZAP_HARNESS_PORT:-5174}:5174"
    environment:
      ZAP_RUNTIME_MODE: local
      ZAP_SIGNER_MODE: dev
      X402_MODE: mock
      ZAP_HARNESS_PORT: 5174
      ZAP_SPONSORED_CLAIM_FEED: ${ZAP_SPONSORED_CLAIM_FEED:-claims/x402-fifty-claims.json}
      ZAP_HARNESS_EVENT_DELAY_MS: ${ZAP_HARNESS_EVENT_DELAY_MS:-75}
      ZAP_HARNESS_AUTO_RUN_MS: ${ZAP_HARNESS_AUTO_RUN_MS:-180000}
      ZAP_RUN_ARTIFACT_DIR: /app/runs
    volumes:
      - ./runs:/app/runs
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:5174/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 2s
      timeout: 2s
      retries: 10

  witness-council:
    profiles: ["workers"]
    build: .
    command: ["bun", "dist/cli.js", "council", "--once"]
    environment:
      ZAP_RUNTIME_MODE: local
      ZAP_SIGNER_MODE: dev
      X402_MODE: mock
      ZAP_NODE_ID: witness-council
      ZAP_CLAIM_FEED: claims/demo.json
      DEEPSEEK_MOCK: ${DEEPSEEK_MOCK:-1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZAP_RUN_ARTIFACT_DIR: /app/runs
    volumes:
      - ./runs:/app/runs

  witness-stablecoin:
    profiles: ["workers"]
    build: .
    command: ["bun", "dist/cli.js", "run", "--once"]
    environment:
      ZAP_RUNTIME_MODE: local
      ZAP_SIGNER_MODE: dev
      X402_MODE: mock
      ZAP_NODE_ID: witness-stablecoin
      ZAP_CLAIM_FEED: claims/demo.json
      DEEPSEEK_MOCK: ${DEEPSEEK_MOCK:-1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZAP_WITNESS_DOMAIN: stablecoins
      ZAP_RUN_ARTIFACT_DIR: /app/runs
    volumes:
      - ./runs:/app/runs
